<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmerQuiz - منصة الاختبارات</title>
    
    <!-- مكتبات Firebase v8 السريعة والمستقرة -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* إعدادات الألوان المتغيرة للوضعين النهاري والليلي */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --primary-color: #2563eb;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
        }
        
        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary-color: #3b82f6;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        /* الجزء العلوي للموقع (الهيدر) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        /* تصميم اسم الموقع بلون جذاب ومتدرج */
        .brand-logo {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(45deg, #1d4ed8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        body.dark-mode .brand-logo {
            background: linear-gradient(45deg, #60a5fa, #f472b6);
            -webkit-background-clip: text;
        }

        .tagline {
            font-size: 14px;
            font-weight: 500;
            opacity: 0.7;
        }

        /* زر الوضع الليلي المطور */
        .theme-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        /* التقسيم الاحترافي للشاشة (الأيمن والأيسر) */
        .main-layout {
            display: flex;
            max-width: 1300px;
            margin: 30px auto;
            gap: 25px;
            padding: 0 20px;
        }

        /* الجانب الأيمن: شاشة التحكم والاختبار */
        .right-section {
            flex: 1.4;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            min-height: 500px;
        }

        /* الجانب الأيسر: لوحة المتصدرين */
        .left-section {
            flex: 1;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            max-height: 650px;
            display: flex;
            flex-direction: column;
        }

        /* ستايل القوائم والمدخلات */
        select, input {
            width: 100%;
            padding: 14px;
            margin: 10px 0 20px 0;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 15px;
            box-sizing: border-box;
        }

        button.action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button.action-btn:hover { opacity: 0.9; }

        .option-btn {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            margin: 10px 0;
            width: 100%;
            text-align: right;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        .option-btn:hover { background: var(--primary-color); color: white; }

        /* تنسيق لوحة المتصدرين وأوائل المنصة */
        .leaderboard-container {
            overflow-y: auto;
            flex-grow: 1;
            padding-left: 5px;
        }
        .leaderboard-title {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .student-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        /* تمييز المراكز والخطوط */
        .top-10 {
            font-weight: bold;
            font-size: 16px;
        }
        .rank-1 { color: #d97706; background: rgba(217, 119, 6, 0.08); border-radius: 8px; border-right: 4px solid #d97706; }
        .rank-2 { color: #475569; background: rgba(71, 85, 105, 0.08); border-radius: 8px; border-right: 4px solid #475569; }
        .rank-3 { color: #b45309; background: rgba(180, 83, 9, 0.08); border-radius: 8px; border-right: 4px solid #b45309; }

        /* مراجعة وتوضيح الأخطاء */
        .review-box {
            margin-top: 25px;
            border-top: 2px dashed var(--border-color);
            padding-top: 15px;
        }
        .review-item {
            text-align: right;
            background: rgba(239, 68, 68, 0.03);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border-right: 4px solid #ef4444;
        }
        .explanation-text {
            font-size: 13px;
            color: #059669;
            margin-top: 6px;
            font-weight: 500;
        }

        /* التوافق مع الشاشات الصغيرة والموبايل */
        @media (max-width: 850px) {
            .main-layout {
                flex-direction: column;
            }
            header {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي وشعار AmerQuiz الجذاب -->
    <header>
        <div>
            <div class="brand-logo">AmerQuiz</div>
            <div class="tagline">منصة التميز والتنافس العلمي والذكاء الدراسي 🚀</div>
        </div>
        <button class="theme-btn" onclick="toggleTheme()">🌙 الوضع الليلي</button>
    </header>

    <!-- التقسيم الرئيسي للمنصة -->
    <div class="main-layout">
        
        <!-- الجانب الأيمن: منطقة التفاعل والاختبارات -->
        <div class="right-section">
            
            <!-- شاشة الدخول واختيار المواد -->
            <div id="quiz-login">
                <div id="welcome-area">
                    <label id="name-label">اسم الطالب الثلاثي:</label>
                    <input type="text" id="student-name" placeholder="اكتب اسمك الثلاثي بدقة للوحة الشرف...">
                </div>

                <label>اختر المادة العلمية للتحدي:</label>
                <select id="quiz-category">
                    <option value="math">الرياضة والتأمين</option>
                    <option value="english">مصطلحات أجنبية</option>
                    <option value="economics">الاقتصاد</option>
                    <option value="management">الإدارة</option>
                    <option value="office">حزم تطبيقية</option>
                </select>

                <button class="action-btn" onclick="startQuiz()">بدء الاختبار والسباق 🏁</button>
            </div>

            <!-- شاشة عرض الأسئلة والخيارات -->
            <div id="quiz-play" style="display: none;">
                <h3 id="question-text" style="font-size: 18px; margin-bottom: 20px;">جاري تحميل السؤال الحين...</h3>
                <div id="options-container"></div>
            </div>

            <!-- شاشة عرض النتيجة ومراجعة الأخطاء وتفسيرها -->
            <div id="quiz-result" style="display: none;">
                <h2 id="feedback-text">أنهيت الاختبار بنجاح!</h2>
                <h3>نقاطك المسجلة: <span id="final-score" style="color: var(--primary-color);">0</span></h3>
                
                <div id="wrong-review-box" class="review-box" style="display: none;">
                    <h4>🔍 تقرير مراجعة الأخطاء بالتوضيح العلمي:</h4>
                    <div id="review-list"></div>
                </div>
                <br>
                <button class="action-btn" onclick="location.reload()">العودة لصفحة المواد 🔄</button>
            </div>

        </div>

        <!-- الجانب الأيسر: لوحة المتصدرين (أوائل المنصة لأول 100) -->
        <div class="left-section">
            <h3 class="leaderboard-title">🏆 أوائل المنصة (أفضل 100 مركز)</h3>
            <div class="leaderboard-container" id="leaderboard-box">
                جاري جلب قائمة الأوائل وتحديث الترتيب...
            </div>
        </div>

    </div>

    <script>
        // ربط فايربيز v8 المباشر بمشروعك الحقيقي
        var firebaseConfig = {
          apiKey: "AIzaSyA7VLIloU_7jbHuexgC4oQUZ6Mj1dwCu1M",
          authDomain: "amer-quiz-65ce2.firebaseapp.com",
          projectId: "amer-quiz-65ce2",
          storageBucket: "amer-quiz-65ce2.firebasestorage.app",
          messagingSenderId: "14966645412",
          appId: "1:14966645412:web:e6c8dee237d9caa6a03c31",
          measurementId: "G-SG2TRRSZEL"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        var db = firebase.firestore();

        // متغيرات النظام
        let score = 0;
        let currentIdx = 0;
        let selectedCategory = "math";
        let wrongAnswersList = [];

        // بنك الأسئلة المحدث للمواد الـ 5 مع خانة التوضيح والتفسير العلمي لكل سؤال
        const quizData = {
            "math": [
                { question: "إذا كانت المصفوفة ثنائية، فكيف نحسب محددها؟", options: ["ad - bc", "ad + bc", "ab - cd"], answer: "ad - bc", exp: "التوضيح: يتم ضرب عناصر القطر الرئيسي وطرح حاصل ضرب عناصر القطر الفرعي منها." }
            ],
            "english": [
                { question: "ما معنى مصطلح 'Management' في بيئة الأعمال؟", options: ["الإدارة", "التسويق", "التمويل الدولي"], answer: "الإدارة", exp: "التوضيح: تشير كلمة Management لعملية التوجيه والقيادة والتنظيم داخل المنشأة." }
            ],
            "economics": [
                { question: "ما هو العلم الذي يدرس كيفية إدارة الموارد المحدودة لتلبية الاحتياجات؟", options: ["علم الاقتصاد", "علم المحاسبة", "الإحصاء التطبيقي"], answer: "علم الاقتصاد", exp: "التوضيح: علم الاقتصاد يبحث أساساً في مشكلة الندرة وكفاءة استغلال الموارد." }
            ],
            "management": [
                { question: "أي مما يلي يعتبر الخطوة الأولى والأساسية في العملية الإدارية؟", options: ["التخطيط", "التنظيم", "الرقابة والمتابعة"], answer: "التخطيط", exp: "التوضيح: التخطيط يسبق جميع الوظائف الإدارية لأنه يحدد الأهداف والمسارات." }
            ],
            "office": [
                { question: "أي المنصات التالية تعد تطبيقاً سحابياً متقدماً لإنشاء العروض التقديمية المرئية؟", options: ["Visme", "Excel", "Access"], answer: "Visme", exp: "التوضيح: منصة Visme هي أداة سحابية شهيرة لعمل التصاميم والعروض التفاعلية الاحترافية." }
            ]
        };

        // الكود الذكي للتحقق من حفظ الاسم فور فتح الصفحة لقفل التكرار ومكافحة الأسماء الوهمية
        window.onload = function() {
            loadLeaderboard();
            
            const savedName = localStorage.getItem('studentName');
            if (savedName) {
                // تعبئة حقل الاسم وإخفاءه لمنع التلاعب والتعديل
                document.getElementById('student-name').value = savedName;
                document.getElementById('student-name').style.display = 'none';
                document.getElementById('name-label').style.display = 'none';
                
                // إنشاء رسالة ترحيب مخصصة وجذابة باسم الطالب الثابت
                const welcomeArea = document.getElementById('welcome-area');
                const greet = document.createElement('h3');
                greet.style.color = 'var(--primary-color)';
                greet.style.margin = '0 0 15px 0';
                greet.innerText = `مرحباً بك مجدداً: ${savedName} 👋`;
                welcomeArea.appendChild(greet);
            }
        };

        // دالة تبديل الوضع الليلي
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.querySelector('.theme-btn').innerText = isDark ? "☀️ الوضع النهاري" : "🌙 الوضع الليلي";
        }

        // جلب أعلى 100 طالب وترتيبهم مع تلوين الأوائل وتضخيم الخط للـ 10 الأوائل
        function loadLeaderboard() {
            db.collection("students_results").orderBy("score", "desc").limit(100).get().then((snapshot) => {
                let html = "";
                let rank = 1;
                snapshot.forEach((doc) => {
                    let data = doc.data();
                    let rowClass = "";
                    
                    // تطبيق شروط التمييز حسب رغبتك
                    if (rank <= 3) rowClass += ` rank-${rank}`;
                    if (rank <= 10) rowClass += " top-10";

                    html += `
                        <div class="student-row ${rowClass}">
                            <span>#${rank} - ${data.name || "طالب مجهول"} <small style="opacity:0.7">(${data.subject || "عام"})</small></span>
                            <span>${data.score} ن</span>
                        </div>
                    `;
                    rank++;
                });
                document.getElementById('leaderboard-box').innerHTML = html || "لا توجد نتائج مسجلة حتى الآن. اختبر لتكون الأول!";
            }).catch(err => {
                document.getElementById('leaderboard-box').innerHTML = "حدث خطأ أثناء تحميل لوحة الشرف.";
            });
        }

        function startQuiz() {
            const nameInput = document.getElementById('student-name').value.trim();
            if(!nameInput) { alert("من فضلك اكتب اسمك الثلاثي أولاً لتدخل لوحة الشرف والمنافسة!"); return; }
            
            // قفل الاسم في ذاكرة المتصفح للأبد لمنع التزوير والتكرار
            localStorage.setItem('studentName', nameInput);
            
            selectedCategory = document.getElementById('quiz-category').value;
            document.getElementById('quiz-login').style.display = "none";
            document.getElementById('quiz-play').style.display = "block";
            loadQuestion();
        }

        function loadQuestion() {
            const qList = quizData[selectedCategory] || [];
            if(currentIdx >= qList.length) { endQuiz(); return; }
            
            const currentQ = qList[currentIdx];
            document.getElementById('question-text').innerText = currentQ.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            
            currentQ.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(opt, currentQ.answer, currentQ.exp);
                container.appendChild(btn);
            });
        }

        function handleAnswer(selected, correct, exp) {
            const qList = quizData[selectedCategory];
            if(selected === correct) {
                score++;
            } else {
                wrongAnswersList.push({
                    question: qList[currentIdx].question,
                    userAns: selected,
                    correctAns: correct,
                    explanation: exp
                });
            }
            currentIdx++;
            loadQuestion();
        }

        function endQuiz() {
            document.getElementById('quiz-play').style.display = "none";
            document.getElementById('quiz-result').style.display = "block";
            
            const qList = quizData[selectedCategory];
            document.getElementById('final-score').innerText = `${score} / ${qList.length}`;
            
            let percent = (score / qList.length) * 100;
            let feedback = "";
            if (percent === 100) feedback = "يا لروعتك! تقييم ممتاز ودرجة كاملة 🏆";
            else if (percent >= 50) feedback = "مستوى جيد جداً، راجع أخطاءك لتقفل المادة 👍";
            else feedback = "محاولة جيدة، اقرأ التفسير العلمي بالأسفل لتتحسن المرة القادمة 📚";
            document.getElementById('feedback-text').innerText = feedback;
            
            const name = localStorage.getItem('studentName') || "طالب بدون اسم";
            const subjectText = document.getElementById('quiz-category').options[document.getElementById('quiz-category').selectedIndex].text;
            
            // رفع البيانات شاملة الاسم والمادة والتوقيت
            db.collection("students_results").add({
                name: name,
                score: score,
                subject: subjectText,
                date: new Date().toLocaleString('ar-EG')
            }).then(() => {
                console.log("تم تحديث النتيجة في السيرفر!");
                loadLeaderboard(); // تحديث فوري للوحة المتصدرين يسار الشاشة
            });

            // تفعيل مراجعة الأخطاء والتوضيح العلمي التفسيري
            if(wrongAnswersList.length > 0) {
                document.getElementById('wrong-review-box').style.display = "block";
                let rHtml = "";
                wrongAnswersList.forEach(item => {
                    rHtml += `
                        <div class="review-item">
                            <strong>السؤال:</strong> ${item.question}<br>
                            <span style="color:#ef4444; font-size:14px;">إجابتك: ${item.userAns}</span> | 
                            <span style="color:#10b981; font-weight:bold; font-size:14px;">الصحيحة: ${item.correctAns}</span>
                            <div class="explanation-text">💡 ${item.explanation}</div>
                        </div>
                    `;
                });
                document.getElementById('review-list').innerHTML = rHtml;
            }
        }
    </script>
</body>
</html>
