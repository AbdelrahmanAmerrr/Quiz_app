<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة اختبارات الرياضة والتأمين</title>
    
    <style>
        :root {
            --bg: #f0f9ff;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --btn-bg: #e0f2fe;
            --btn-text: #0369a1;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #7dd3fc;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .review-item {
            text-align: right;
            border-bottom: 1px solid var(--border);
            padding: 10px 0;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        // إعدادات مشروعك الحقيقي الحالية
        const firebaseConfig = {
            apiKey: "AIzaSyA7VLIloU_7jbHuexgC4oQUZ6Mj1dwCu1M",
            authDomain: "amer-quiz-65ce2.firebaseapp.com",
            projectId: "amer-quiz-65ce2",
            storageBucket: "amer-quiz-65ce2.firebasestorage.app",
            messagingSenderId: "14966645412",
            appId: "1:14966645412:web:e6c8dee237d9caa6a03c31",
            measurementId: "G-SG2TRRSZEL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // دالة إرسال البيانات المربوطة بالنافذة العالمية للمتصفح
        window.saveStudentResult = async (studentName, studentScore, totalQuestions) => {
            try {
                await addDoc(collection(db, "students_results"), {
                    name: studentName,
                    score: studentScore,
                    total: totalQuestions,
                    date: new Date().toLocaleString('ar-EG')
                });
                console.log("تم إرسال النتيجة إلى Firebase بنجاح!");
            } catch (error) {
                console.error("حدث خطأ أثناء الإرسال: ", error);
            }
        };
    </script>
</head>
<body>

    <div class="container">
        <div id="quiz-login">
            <h2>مرحباً بك في منصة الاختبارات</h2>
            <input type="text" id="student-name" placeholder="اكتب اسمك الثلاثي هنا..." style="padding:10px; width:80%; margin-bottom:15px; border-radius:5px; border:1px solid #ccc;"><br>
            <button onclick="startQuiz()">بدء الاختبار</button>
        </div>

        <div id="quiz-play" style="display: none;">
            <h2 id="question-text">جاري تحميل السؤال...</h2>
            <div id="options-container"></div>
            <br>
            <button id="next-btn" onclick="goToNextQuestion()">التالي</button>
        </div>

        <div id="quiz-result" style="display: none;">
            <h2 id="feedback-text">النظام يحسب نتيجتك...</h2>
            <h3>درجتك الحالية هي: <span id="final-score">0</span></h3>
            
            <div id="wrong-review-box" style="display: none; margin-top: 20px;">
                <h3>تقرير مراجعة الأخطاء:</h3>
                <div id="review-list"></div>
            </div>
            <br>
            <button onclick="location.reload()">إعادة الاختبار 🔄</button>
        </div>
    </div>

    <script>
        // متغيرات اللعبة الأساسية
        let score = 0;
        let currentQuestionIndex = 0;
        let currentCategory = "math"; 
        let wrongAnswersList = []; 

        // 💡 ضع هنا مصفوفة الأسئلة الخاصة بك بالكامل (قاعدة البيانات للأسئلة)
        const quizData = {
            "math": [
                {
                    question: "ما هو ناتج جمع 5 + 5؟",
                    options: ["10", "15", "20", "25"],
                    answer: "10",
                    exp: "التفسير: جمع عادي ومباشر."
                },
                {
                    question: "إذا كانت المصفوفة ثنائية، فكيف نحسب محددها؟",
                    options: ["ad - bc", "ad + bc", "ab - cd", "ab + cd"],
                    answer: "ad - bc",
                    exp: "التفسير: حاصل ضرب عناصر القطر الرئيسي ناقص القطر الفرعي."
                }
            ]
        };

        function startQuiz() {
            const nameInput = document.getElementById('student-name').value.trim();
            if(nameInput === "") {
                alert("برجاء إدخال اسمك أولاً لبدء الاختبار!");
                return;
            }
            document.getElementById('quiz-login').style.display = "none";
            document.getElementById('quiz-play').style.display = "block";
            loadQuestion();
        }

        function loadQuestion() {
            const activeQuestions = quizData[currentCategory];
            const currentQuestion = activeQuestions[currentQuestionIndex];
            
            document.getElementById('question-text').innerText = currentQuestion.question;
            const container = document.getElementById('options-container');
            container.innerHTML = "";

            currentQuestion.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.style.margin = "5px";
                btn.style.display = "block";
                btn.style.width = "100%";
                btn.onclick = () => checkAnswer(opt, currentQuestion.answer, currentQuestion.exp);
                container.appendChild(btn);
            });
        }

        function checkAnswer(userOpt, correctOpt, explanation) {
            const activeQuestions = quizData[currentCategory];
            if(userOpt === correctOpt) {
                score++;
            } else {
                wrongAnswersList.push({
                    question: activeQuestions[currentQuestionIndex].question,
                    userAnswer: userOpt,
                    correctAnswer: correctOpt,
                    exp: explanation
                });
            }
            goToNextQuestion();
        }

        function goToNextQuestion() {
            const activeQuestions = quizData[currentCategory];
            currentQuestionIndex++;
            if(currentQuestionIndex < activeQuestions.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        // دالة نهاية الاختبار المعدلة والمصححة بالكامل بدون أي أخطاء أقواس
        function showEndScreen() {
            const activeQuestions = quizData[currentCategory];
            document.getElementById('quiz-play').style.display = "none";
            document.getElementById('quiz-result').style.display = "block";
            document.getElementById('final-score').innerText = score + " / " + activeQuestions.length;

            let percent = (score / activeQuestions.length) * 100;
            let feedback = "";
            if (percent === 100) {
                feedback = "امتياز! عبقري في الرياضة والتأمين 👑";
            } else if (percent >= 50) {
                feedback = "أداء جيد جداً 👍 واقرأ الأخطاء لتتحسن";
            } else {
                feedback = "محاولة طيبة، راجع تقرير الأخطاء بالأسفل وأعد الاختبار 📚";
            }
            document.getElementById('feedback-text').innerText = feedback;

            // استدعاء الفايربيز وحفظ اسم الطالب والنتيجة
            if (typeof window.saveStudentResult === 'function') {
                const nameOfStudent = document.getElementById('student-name').value || "طالب مجهول";
                window.saveStudentResult(nameOfStudent, score, activeQuestions.length);
            }

            // بناء واجهة مراجعة الأخطاء بالتفصيل
            const reviewBox = document.getElementById('wrong-review-box');
            const reviewList = document.getElementById('review-list');
            reviewList.innerHTML = ""; 

            if (wrongAnswersList.length > 0) {
                reviewBox.style.display = "block";
                wrongAnswersList.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = "review-item";
                    div.innerHTML = `
                        <div style="font-weight:bold;">${index + 1}. ${item.question}</div>
                        <div style="margin: 5px 0;">
                            <span style="color:#ef4444; margin-left: 15px;">إجابتك: ${item.userAnswer}</span>
                            <span style="color:#10b981;">الإجابة الصحيحة: ${item.correctAnswer}</span>
                        </div>
                        <div style="font-size:13px; color:#64748b;">${item.exp}</div>
                    `;
                    reviewList.appendChild(div);
                });
            } else {
                reviewBox.style.display = "none";
            }
        }
    </script>
</body>
</html>
